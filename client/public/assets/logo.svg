<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ra1-grad-primary" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="ra1-grad-glow" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="ra1-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Tech Hexagon -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0A0B10" stroke="url(#ra1-grad-primary)" stroke-width="8" />

  <!-- Core Geometric "r" & "1" Symbol -->
  <g filter="url(#ra1-glow)">
    <!-- Arc for "r" -->
    <path d="M152 368V192C152 165.49 173.49 144 200 144H240C266.51 144 288 165.49 288 192V216" stroke="url(#ra1-grad-primary)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dot for "r" / accent node -->
    <circle cx="288" cy="220" r="16" fill="#00F0FF" />

    <!-- Stem for "1" -->
    <path d="M336 172L364 144V368" stroke="url(#ra1-grad-primary)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cross base accent line -->
    <path d="M128 368H384" stroke="url(#ra1-grad-primary)" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
